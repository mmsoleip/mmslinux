<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 — Lost in Space</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030308;
    font-family:
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
    color: white;
}

body {
    position: relative;
    cursor: crosshair;
}

/* =========================
   背景
========================= */

.space {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(70, 30, 120, .18),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 30%,
            rgba(0, 180, 255, .08),
            transparent 30%
        ),
        #030308;
}

/* =========================
   粒子
========================= */

.particle {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: white;

    opacity: .6;

    animation:
        floatParticle
        linear infinite;
}

@keyframes floatParticle {

    from {
        transform:
            translate3d(0, 110vh, 0)
            scale(.2);
    }

    to {
        transform:
            translate3d(
                var(--drift),
                -20vh,
                0
            )
            scale(1.4);
    }
}

/* =========================
   中央空间
========================= */

.universe {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 500px;
    height: 500px;

    transform:
        translate(-50%, -50%);

    perspective: 900px;
}

/* =========================
   空间裂缝
========================= */

.portal {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 260px;
    height: 260px;

    transform:
        translate(-50%, -50%)
        rotateX(60deg);

    border-radius: 50%;

    background:

        radial-gradient(
            ellipse,
            transparent 25%,
            rgba(0, 255, 255, .12) 26%,
            transparent 27%,
            rgba(255, 0, 255, .12) 35%,
            transparent 36%,
            rgba(100, 0, 255, .2) 55%,
            transparent 70%
        );

    filter:
        blur(1px)
        drop-shadow(
            0 0 30px
            rgba(0,255,255,.4)
        );

    animation:
        portalSpin
        8s linear infinite;
}

@keyframes portalSpin {

    from {
        transform:
            translate(-50%, -50%)
            rotateX(60deg)
            rotateZ(0deg)
            scale(1);
    }

    50% {
        scale: 1.12;
    }

    to {
        transform:
            translate(-50%, -50%)
            rotateX(60deg)
            rotateZ(360deg)
            scale(1);
    }
}

/* =========================
   黑洞核心
========================= */

.core {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 110px;
    height: 110px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #000 35%,
            rgba(50,0,80,.8) 55%,
            transparent 70%
        );

    box-shadow:

        0 0 20px #7b00ff,
        0 0 60px #4100ff,
        0 0 120px rgba(0,255,255,.25);

    animation:
        breathe
        3s ease-in-out infinite;
}

@keyframes breathe {

    0%,
    100% {
        transform:
            translate(-50%, -50%)
            scale(.9);
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.15);
    }
}

/* =========================
   轨道
========================= */

.orbit {

    position: absolute;

    left: 50%;
    top: 50%;

    border: 1px solid
        rgba(0,255,255,.35);

    border-radius: 50%;

    transform-style: preserve-3d;
}

.orbit:nth-child(1) {

    width: 340px;
    height: 100px;

    transform:
        translate(-50%, -50%)
        rotateX(65deg)
        rotateZ(20deg);

    animation:
        orbit1
        7s linear infinite;
}

.orbit:nth-child(2) {

    width: 300px;
    height: 180px;

    transform:
        translate(-50%, -50%)
        rotateX(65deg)
        rotateZ(-40deg);

    border-color:
        rgba(255,0,255,.35);

    animation:
        orbit2
        11s linear infinite;
}

@keyframes orbit1 {

    to {
        transform:
            translate(-50%, -50%)
            rotateX(65deg)
            rotateZ(380deg);
    }
}

@keyframes orbit2 {

    to {
        transform:
            translate(-50%, -50%)
            rotateX(65deg)
            rotateZ(-400deg);
    }
}

/* =========================
   轨道粒子
========================= */

.orbit::after {

    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    top: -4px;
    left: 50%;

    border-radius: 50%;

    background: #00ffff;

    box-shadow:
        0 0 10px #00ffff,
        0 0 30px #00ffff;
}

/* =========================
   404
========================= */

.error {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 10;

    text-align: center;

    user-select: none;
}

.error h1 {

    position: relative;

    font-size:
        clamp(100px, 18vw, 190px);

    line-height: .8;

    font-weight: 900;

    letter-spacing:
        -15px;

    color: white;

    text-shadow:

        4px 0 #ff00ff,
        -4px 0 #00ffff,
        0 0 30px
        rgba(255,255,255,.3);

    animation:
        glitch
        2.8s
        infinite;
}

@keyframes glitch {

    0%,
    90%,
    100% {
        transform:
            translate(0);
        clip-path: none;
    }

    91% {
        transform:
            translate(-8px, 2px);
        clip-path:
            inset(20% 0 60% 0);
    }

    93% {
        transform:
            translate(8px, -2px);
        clip-path:
            inset(60% 0 15% 0);
    }

    95% {
        transform:
            translate(-4px);
        clip-path:
            inset(40% 0 40% 0);
    }
}

/* =========================
   文案
========================= */

.message {

    margin-top: 35px;

    font-size: 15px;

    letter-spacing:
        6px;

    color:
        rgba(255,255,255,.75);

    text-transform:
        uppercase;

    animation:
        fadeIn
        2s ease;
}

.sub {

    margin-top: 15px;

    font-size: 12px;

    letter-spacing:
        2px;

    color:
        rgba(255,255,255,.4);
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform:
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}

/* =========================
   返回按钮
========================= */

.back {

    display: inline-block;

    margin-top: 30px;

    padding:
        12px 25px;

    color: white;

    text-decoration: none;

    font-size: 12px;

    letter-spacing: 3px;

    border:
        1px solid
        rgba(255,255,255,.3);

    background:
        rgba(255,255,255,.03);

    backdrop-filter:
        blur(10px);

    transition:
        .3s;
}

.back:hover {

    background:
        rgba(0,255,255,.1);

    border-color:
        #00ffff;

    box-shadow:
        0 0 25px
        rgba(0,255,255,.3);

    transform:
        translateY(-3px);
}

/* =========================
   鼠标光晕
========================= */

.cursor {

    position: fixed;

    width: 250px;
    height: 250px;

    border-radius: 50%;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.07),
            transparent 70%
        );

    transform:
        translate(-50%, -50%);

    z-index: 2;

    mix-blend-mode: screen;
}

/* =========================
   点击产生波纹
========================= */

.ripple {

    position: fixed;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    border:
        1px solid
        rgba(0,255,255,.8);

    pointer-events: none;

    animation:
        ripple 1.2s ease-out
        forwards;
}

@keyframes ripple {

    from {
        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;
    }

    to {
        transform:
            translate(-50%, -50%)
            scale(20);

        opacity: 0;
    }
}

/* =========================
   手机
========================= */

@media (max-width: 600px) {

    .universe {

        width: 350px;
        height: 350px;
    }

    .portal {

        width: 190px;
        height: 190px;
    }

    .core {

        width: 80px;
        height: 80px;
    }

    .orbit:nth-child(1) {

        width: 260px;
    }

    .orbit:nth-child(2) {

        width: 230px;
    }

    .error h1 {

        letter-spacing:
            -8px;
    }

    .message {

        font-size: 11px;

        letter-spacing:
            4px;
    }
}

</style>
</head>


<body>

<div class="space">

    <!-- 鼠标光晕 -->
    <div class="cursor" id="cursor"></div>

    <!-- 中央宇宙 -->
    <div class="universe">

        <div class="portal"></div>

        <div class="orbit"></div>

        <div class="orbit"></div>

        <div class="core"></div>

    </div>

    <!-- 404 -->
    <div class="error">

        <h1>404</h1>

        <div class="message">
            REALITY NOT FOUND
        </div>

        <div class="sub">
            你进入了一个不存在的空间
        </div>

        <a href="/" class="back">
            RETURN TO REALITY
        </a>

    </div>

</div>


<script>

/* =========================
   创建星尘
========================= */

const space =
    document.querySelector(".space");

for (let i = 0; i < 180; i++) {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.setProperty(
        "--drift",
        (Math.random() * 200 - 100) + "px"
    );

    particle.style.animationDuration =
        (8 + Math.random() * 20) + "s";

    particle.style.animationDelay =
        (-Math.random() * 20) + "s";

    particle.style.opacity =
        Math.random();

    const size =
        Math.random() * 3 + 1;

    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";

    space.appendChild(particle);
}


/* =========================
   鼠标控制空间
========================= */

const cursor =
    document.getElementById("cursor");

const universe =
    document.querySelector(".universe");

let mouseX = 0;
let mouseY = 0;

let targetX = 0;
let targetY = 0;

document.addEventListener(
    "mousemove",
    e => {

        targetX =
            (e.clientX /
            window.innerWidth - .5)
            * 30;

        targetY =
            (e.clientY /
            window.innerHeight - .5)
            * 30;

        cursor.style.left =
            e.clientX + "px";

        cursor.style.top =
            e.clientY + "px";
    }
);


/* =========================
   平滑空间移动
========================= */

function animateSpace() {

    mouseX +=
        (targetX - mouseX) * .04;

    mouseY +=
        (targetY - mouseY) * .04;

    universe.style.transform =
        `
        translate(
            calc(-50% + ${mouseX}px),
            calc(-50% + ${mouseY}px)
        )
        rotateX(${mouseY * .2}deg)
        rotateY(${mouseX * .2}deg)
        `;

    requestAnimationFrame(
        animateSpace
    );
}

animateSpace();


/* =========================
   点击产生时空波纹
========================= */

document.addEventListener(
    "click",
    e => {

        const ripple =
            document.createElement("div");

        ripple.className =
            "ripple";

        ripple.style.left =
            e.clientX + "px";

        ripple.style.top =
            e.clientY + "px";

        document.body.appendChild(
            ripple
        );

        setTimeout(
            () => ripple.remove(),
            1200
        );
    }
);


/* =========================
   404 数字随机漂移
========================= */

const title =
    document.querySelector(".error h1");

setInterval(() => {

    if (Math.random() > .75) {

        title.style.transform =
            `
            translate(
                ${Math.random() * 8 - 4}px,
                ${Math.random() * 6 - 3}px
            )
            skew(
                ${Math.random() * 8 - 4}deg
            )
            `;

        setTimeout(() => {

            title.style.transform =
                "translate(0)";

        }, 100);

    }

}, 700);

</script>

</body>
</html>
